name: tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  simulate-and-synthesize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install Icarus Verilog and Yosys
        run: |
          sudo apt-get update
          sudo apt-get install -y iverilog yosys

      - name: Tool versions
        run: |
          iverilog -V 2>&1 | head -1
          yosys -V

      - name: Simulate
        run: make test

      - name: Synthesize
        run: make synth
